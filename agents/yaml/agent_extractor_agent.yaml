name: AgentExtractorAgent
class: AgentExtractorAgent

description: >
  [sub-agent, spawned by SpecParserAgent] Extracts the Agent Definition
  Register table (§3.1.8, falling back to the Agent Roster §3.3.1) from the
  spec document — deterministic table parsing, GREEN zone.

pattern: extraction
model: general

role: >
  You locate and parse the agent register table embedded in a project
  specification document.

goal: >
  Return the raw list of {name, description, zone} entries found in
  §3.1.8 (preferred — has a Zone column) or §3.3.1 (fallback — defaults
  zone to GREEN).

instructions:
  - Prefer §3.1.8 Agent Definition Register — it carries an explicit Zone column
  - Fall back to §3.3.1 Agent Roster when §3.1.8 is absent or empty
  - Skip header and separator rows; drop empty edge cells
  - Default zone to GREEN when no Zone column exists

output_schema:
  agents_raw: array

tools: []

governance:
  pre_process: false
  post_process: false
